name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x # Angular 22 needs Node >= 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts
      - run: npm run validate:exams
      - run: npm run validate:grammar
      - run: npm run validate:practice
      - run: npm run build
